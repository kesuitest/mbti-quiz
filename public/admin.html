<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI Quiz Admin - Edit Questions</title>
  <meta name="description" content="Visual Admin Editor for MBTI Quiz questions powered by Netlify Blobs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0e1013;
      --card-bg: #16191d;
      --card-border: #2a2f36;
      --primary: #e63946;
      --primary-hover: #ff4d5a;
      --accent: #e63946;
      --green: #10b981;
      --red: #e63946;
      --text-main: #f8f9fa;
      --text-muted: #9ba0a6;
      --radius: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 900px;
      z-index: 1;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 0px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 2.75rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: -0.03em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Top Control Bar */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 0px;
      padding: 1.25rem 1.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 0px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      border: 2px solid var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--card-border);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #ffffff;
    }

    .btn-danger {
      background: rgba(230, 57, 70, 0.15);
      border: 2px solid rgba(230, 57, 70, 0.4);
      color: #ffccd5;
    }
    .btn-danger:hover {
      background: rgba(230, 57, 70, 0.3);
      border-color: var(--primary);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
    }

    /* Question Cards List */
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .q-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 0px;
      padding: 1.75rem;
      position: relative;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .q-number {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    .select-dim {
      background: #0e1013;
      border: 2px solid var(--card-border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 0px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
    }

    .input-text {
      width: 100%;
      background: #0e1013;
      border: 2px solid var(--card-border);
      color: #fff;
      padding: 0.8rem 1rem;
      border-radius: 0px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      margin-bottom: 1.25rem;
      outline: none;
    }
    .input-text:focus {
      border-color: var(--primary);
    }

    /* Option Editor */
    .options-editor {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .opt-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .input-opt-text {
      flex: 1;
      background: #0e1013;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.6rem 0.9rem;
      border-radius: 0px;
      font-size: 0.9rem;
    }

    .input-opt-val {
      width: 120px;
      background: #0e1013;
      border: 1px solid var(--card-border);
      color: var(--primary);
      padding: 0.6rem 0.9rem;
      border-radius: 0px;
      font-size: 0.85rem;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
    }

    /* Password Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(14, 16, 19, 0.95);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-box {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 0px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .login-box h2 {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .error-msg {
      color: var(--red);
      font-size: 0.85rem;
      font-family: 'Space Mono', monospace;
      margin-top: 0.75rem;
      display: none;
    }

    /* Toast Alert */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 0px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 100;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Password Authentication Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="login-box">
      <span class="badge">Protected Admin Area</span>
      <h2>Admin Login</h2>
      <p>Enter your password to access the question editor.</p>
      
      <form id="login-form">
        <input type="password" id="admin-pass" class="input-text" placeholder="Enter Admin Password..." style="margin-bottom: 1rem;" required autofocus>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">🔒 Unlock Dashboard</button>
        <div class="error-msg" id="login-err">Incorrect password. Please try again.</div>
      </form>
    </div>
  </div>

  <div class="container" id="admin-content" style="display: none;">
    <header>
      <span class="badge">Question Manager</span>
      <h1>MBTI Question Editor</h1>
      <p class="subtitle">Customize quiz questions, dimension weights, and options live on Netlify.</p>
    </header>

    <div class="control-bar">
      <div>
        <a href="/index.html" class="btn btn-secondary" style="text-decoration:none;">⬅ Back to Quiz</a>
        <button class="btn btn-secondary" id="btn-add-q">➕ Add New Question</button>
      </div>
      <div>
        <button class="btn btn-danger" id="btn-reset">🔄 Reset Defaults</button>
        <button class="btn btn-primary" id="btn-save">💾 Save Changes</button>
      </div>
    </div>

    <div class="questions-list" id="questions-container">
      <p style="text-align:center; color: var(--text-muted);">Loading questions...</p>
    </div>
  </div>

  <div class="toast" id="toast">Changes saved!</div>

  <script>
    let questions = [];
    let adminToken = sessionStorage.getItem('mbti_admin_pass') || '';

    const loginModal = document.getElementById('login-modal');
    const adminContent = document.getElementById('admin-content');
    const loginForm = document.getElementById('login-form');
    const adminPassInput = document.getElementById('admin-pass');
    const loginErr = document.getElementById('login-err');

    if (adminToken === 'mewmewdog') {
      unlockAdmin();
    }

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const entered = adminPassInput.value.trim();
      if (entered === 'mewmewdog') {
        adminToken = entered;
        sessionStorage.setItem('mbti_admin_pass', entered);
        unlockAdmin();
      } else {
        loginErr.style.display = 'block';
        adminPassInput.value = '';
        adminPassInput.focus();
      }
    };

    function unlockAdmin() {
      loginModal.style.display = 'none';
      adminContent.style.display = 'block';
      loadQuestions();
    }

    async function loadQuestions() {
      try {
        const res = await fetch('/api/get-questions');
        const data = await res.json();
        questions = data.questions || [];
        renderQuestions();
      } catch (err) {
        console.error('Failed to load questions:', err);
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let optionsHtml = '';
        (q.options || []).forEach((opt, optIdx) => {
          const valStr = JSON.stringify(opt.value || {}).replace(/"/g, '');
          optionsHtml += `
            <div class="opt-row">
              <input type="text" class="input-opt-text" value="${escapeHtml(opt.text)}" onchange="updateOptText(${qIdx}, ${optIdx}, this.value)" placeholder="Option text...">
              <input type="text" class="input-opt-val" value="${escapeHtml(valStr)}" onchange="updateOptValue(${qIdx}, ${optIdx}, this.value)" placeholder="{E:2,I:0}">
              <button class="btn btn-danger btn-sm" onclick="deleteOption(${qIdx}, ${optIdx})">✕</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="q-header">
            <span class="q-number">Question ${qIdx + 1}</span>
            <div>
              <select class="select-dim" onchange="updateDim(${qIdx}, this.value)">
                <option value="EI" ${q.dim === 'EI' ? 'selected' : ''}>Dimension: EI (Extraversion / Introversion)</option>
                <option value="SN" ${q.dim === 'SN' ? 'selected' : ''}>Dimension: SN (Sensing / Intuition)</option>
                <option value="TF" ${q.dim === 'TF' ? 'selected' : ''}>Dimension: TF (Thinking / Feeling)</option>
                <option value="JP" ${q.dim === 'JP' ? 'selected' : ''}>Dimension: JP (Judging / Perceiving)</option>
              </select>
              <button class="btn btn-danger btn-sm" onclick="deleteQuestion(${qIdx})">Delete Question</button>
            </div>
          </div>
          <input type="text" class="input-text" value="${escapeHtml(q.text)}" onchange="updateQText(${qIdx}, this.value)" placeholder="Type question text...">
          
          <div class="options-editor">
            ${optionsHtml}
          </div>
          <button class="btn btn-secondary btn-sm" onclick="addOption(${qIdx})">➕ Add Option Choice</button>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateQText(qIdx, text) { questions[qIdx].text = text; }
    function updateDim(qIdx, dim) { questions[qIdx].dim = dim; }

    function updateOptText(qIdx, optIdx, text) {
      questions[qIdx].options[optIdx].text = text;
    }

    function updateOptValue(qIdx, optIdx, valStr) {
      try {
        let clean = valStr.trim();
        if (!clean.startsWith('{')) clean = '{' + clean + '}';
        clean = clean.replace(/([A-Z]):/g, '"$1":');
        questions[qIdx].options[optIdx].value = JSON.parse(clean);
      } catch (e) {
        console.warn('Invalid JSON format for option value:', valStr);
      }
    }

    function addOption(qIdx) {
      const dim = questions[qIdx].dim || 'EI';
      const defaultVal = dim === 'EI' ? { E: 1, I: 0 } : { S: 1, N: 0 };
      questions[qIdx].options.push({ text: "New Choice", value: defaultVal });
      renderQuestions();
    }

    function deleteOption(qIdx, optIdx) {
      questions[qIdx].options.splice(optIdx, 1);
      renderQuestions();
    }

    function deleteQuestion(qIdx) {
      questions.splice(qIdx, 1);
      renderQuestions();
    }

    document.getElementById('btn-add-q').onclick = () => {
      questions.push({
        id: questions.length + 1,
        dim: 'EI',
        text: "New MBTI Question?",
        options: [
          { text: "Option A", value: { E: 2, I: 0 } },
          { text: "Option B", value: { E: 0, I: 2 } }
        ]
      });
      renderQuestions();
    };

    document.getElementById('btn-save').onclick = async () => {
      const btn = document.getElementById('btn-save');
      btn.innerHTML = '⌛ Saving...';

      try {
        const res = await fetch('/api/save-questions', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-admin-password': adminToken
          },
          body: JSON.stringify({ questions, password: adminToken })
        });
        const data = await res.json();
        if (res.status === 401) {
          showToast('Unauthorized: Incorrect password!');
          sessionStorage.removeItem('mbti_admin_pass');
          setTimeout(() => location.reload(), 1500);
        } else {
          showToast(data.message || 'Saved successfully!');
        }
      } catch (err) {
        showToast('Error saving questions: ' + err.message);
      } finally {
        btn.innerHTML = '💾 Save Changes';
      }
    };

    document.getElementById('btn-reset').onclick = async () => {
      if (!confirm('Are you sure you want to reset all questions to the default set?')) return;
      try {
        const res = await fetch('/api/save-questions', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-admin-password': adminToken
          },
          body: JSON.stringify({ reset: true, password: adminToken })
        });
        const data = await res.json();
        showToast('Reset to default questions!');
        loadQuestions();
      } catch (err) {
        showToast('Error resetting questions: ' + err.message);
      }
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
